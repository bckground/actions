---
name: "CLA - Check"
description: "This action determines if commit authors have signed a CLA."

inputs:
  github-token:
    description: "explicit passing of GITHUB_TOKEN secret"
    required: true
  cla-assistant-token:
    description: "explicit passing of CLA_ASSISTANT_ACCESS_TOKEN secret"
    required: true

runs:
  using: "composite"
  steps:
    - name: "CLA Check"
      if: "(github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'"
      uses: "bckground/github-action@d9c40d97ede22667a3be6e2c9eeed4a34f2a4e70" # feat/node24 (v2.6.1 on node24)
      env:
        GITHUB_TOKEN: "${{ inputs.github-token }}"
        PERSONAL_ACCESS_TOKEN: "${{ inputs.cla-assistant-token }}"
      with:
        remote-organization-name: "bckground"
        remote-repository-name: "cla"
        path-to-signatures: "v1/signatures.json"
        path-to-document: "https://github.com/bckground/cla/blob/main/v1/icla.md"
        branch: "main"
        allowlist: "dependabot[bot],github-actions[bot],autofix-ci[bot]"
