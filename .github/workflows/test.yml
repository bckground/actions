---
name: "test"

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  preflight:
    name: "preflight"
    runs-on: "blacksmith-2vcpu-ubuntu-2404-arm"
    outputs:
      setup_mise_backends: "${{ steps.set.outputs.setup_mise_backends }}"
      cache_go_backends: "${{ steps.set.outputs.cache_go_backends }}"
    steps:
      # The s3 backend needs OVH secrets, which are unavailable on fork PRs.
      # Only include s3 in the matrices when the secret is present.
      - name: "Determine testable backends"
        id: "set"
        shell: "bash"
        env:
          S3_BUCKET: "${{ secrets.OVH_GHA_CACHE_BUCKET_NAME }}"
        run: |
          if [ -n "$S3_BUCKET" ]; then
            echo 'setup_mise_backends=["none","github","s3"]' | tee -a "$GITHUB_OUTPUT"
            echo 'cache_go_backends=["github","s3"]' | tee -a "$GITHUB_OUTPUT"
          else
            echo 'setup_mise_backends=["none","github"]' | tee -a "$GITHUB_OUTPUT"
            echo 'cache_go_backends=["github"]' | tee -a "$GITHUB_OUTPUT"
          fi

  guard:
    name: "validation guard"
    runs-on: "blacksmith-2vcpu-ubuntu-2404-arm"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Reject invalid cache-backend"
        id: "invalid-backend"
        continue-on-error: true
        uses: "./setup-mise"
        with:
          cache-backend: "bogus"

      - name: "Reject s3 without credentials"
        id: "s3-no-credentials"
        continue-on-error: true
        uses: "./setup-mise"
        with:
          cache-backend: "s3"

      - name: "cache-go rejects none"
        id: "cachego-none"
        continue-on-error: true
        uses: "./cache-go/restore"
        with:
          cache-backend: "none"

      - name: "Assert guard behavior"
        shell: "bash"
        env:
          INVALID_BACKEND_OUTCOME: "${{ steps.invalid-backend.outcome }}"
          S3_NO_CREDENTIALS_OUTCOME: "${{ steps.s3-no-credentials.outcome }}"
          CACHEGO_NONE_OUTCOME: "${{ steps.cachego-none.outcome }}"
        run: |
          fail=0
          if [ "$INVALID_BACKEND_OUTCOME" != "failure" ]; then
            echo "::error::invalid cache-backend should fail (got '$INVALID_BACKEND_OUTCOME')"
            fail=1
          fi
          if [ "$S3_NO_CREDENTIALS_OUTCOME" != "failure" ]; then
            echo "::error::s3 without credentials should fail (got '$S3_NO_CREDENTIALS_OUTCOME')"
            fail=1
          fi
          if [ "$CACHEGO_NONE_OUTCOME" != "failure" ]; then
            echo "::error::cache-go should reject cache-backend 'none' (got '$CACHEGO_NONE_OUTCOME')"
            fail=1
          fi
          exit "$fail"

  setup-mise:
    name: "setup-mise (${{ matrix.backend }})"
    needs: "preflight"
    runs-on: "blacksmith-2vcpu-ubuntu-2404-arm"
    strategy:
      fail-fast: false
      matrix:
        backend: "${{ fromJSON(needs.preflight.outputs.setup_mise_backends) }}"
    env:
      S3_CREDENTIALS: >-
        ${{ format('{{"endpoint": "{0}", "access_key": "{1}", "secret_key": "{2}", "bucket_name": "{3}"}}',
        secrets.OVH_GHA_CACHE_ENDPOINT, vars.OVH_GHA_CACHE_USER_SECRET_ID, secrets.OVH_GHA_CACHE_USER_SECRET, secrets.OVH_GHA_CACHE_BUCKET_NAME) }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - name: "Set up mise"
        uses: "./setup-mise"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"

      - name: "Assert tools are available"
        run: |
          prettier --version

  cache-go:
    name: "cache-go (${{ matrix.backend }})"
    needs: "preflight"
    runs-on: "blacksmith-2vcpu-ubuntu-2404-arm"
    strategy:
      fail-fast: false
      matrix:
        backend: "${{ fromJSON(needs.preflight.outputs.cache_go_backends) }}"
    env:
      S3_CREDENTIALS: >-
        ${{ format('{{"endpoint": "{0}", "access_key": "{1}", "secret_key": "{2}", "bucket_name": "{3}"}}',
        secrets.OVH_GHA_CACHE_ENDPOINT, vars.OVH_GHA_CACHE_USER_SECRET_ID, secrets.OVH_GHA_CACHE_USER_SECRET, secrets.OVH_GHA_CACHE_BUCKET_NAME) }}
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      - uses: "actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e" # v7.0.0
        with:
          go-version: "1.24"
          cache: false

      # The touch backdates the sources past Go's modTimeCutoff (2s): Go
      # refuses to index a directory containing a file modified that recently,
      # and the mtime-churn test below needs the per-directory index to be in
      # the cache before the first save.
      - name: "Populate go caches"
        working-directory: "_test/fixtures/go"
        run: |
          touch -d "2001-02-03 04:05:06" ./*
          go mod download
          go build -o /dev/null .

      - name: "Save go caches"
        id: "save-first"
        uses: "./cache-go/save"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.sum"

      # No restore ran before this save, so neither cache can be skipped.
      - name: "Assert the first save stores both caches"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_SAVED: "${{ steps.save-first.outputs.mod-cache-saved }}"
          BUILD_SAVED: "${{ steps.save-first.outputs.build-cache-saved }}"
        run: |
          fail=0
          if [ "$MOD_SAVED" != "true" ]; then
            echo "::error::expected mod-cache-saved=true on the first save for backend , got "
            fail=1
          fi
          if [ "$BUILD_SAVED" != "true" ]; then
            echo "::error::expected build-cache-saved=true on the first save for backend , got "
            fail=1
          fi
          exit "$fail"

      - name: "Restore go caches"
        id: "restore"
        uses: "./cache-go/restore"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.sum"

      # The module cache is keyed on go.sum, so it matches exactly. The build
      # cache is keyed on a fingerprint of its own contents, which is unknowable
      # before the restore, so it is always found through its restore-key and
      # "partial" is the success case.
      - name: "Assert cache hit"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_HIT: "${{ steps.restore.outputs.mod-cache-hit }}"
          MOD_MATCH: "${{ steps.restore.outputs.mod-cache-match }}"
          BUILD_MATCH: "${{ steps.restore.outputs.build-cache-match }}"
        run: |
          fail=0
          if [ "$MOD_HIT" != "true" ]; then
            echo "::error::expected mod-cache-hit=true for backend '$BACKEND', got '$MOD_HIT'"
            fail=1
          fi
          if [ "$MOD_MATCH" != "exact" ]; then
            echo "::error::expected mod-cache-match=exact for backend '$BACKEND', got '$MOD_MATCH'"
            fail=1
          fi
          if [ "$BUILD_MATCH" != "partial" ]; then
            echo "::error::expected build-cache-match=partial for backend '$BACKEND', got '$BUILD_MATCH'"
            fail=1
          fi
          exit "$fail"

      # Nothing was built since the restore above, so the build cache is what
      # was restored and must not be uploaded again.
      - name: "Save go caches again without rebuilding"
        id: "save-unchanged"
        uses: "./cache-go/save"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.sum"

      # The restore above matched the module cache exactly and nothing was built
      # since, so neither cache has anything new to store.
      - name: "Assert an unchanged save stores nothing"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_SAVED: "${{ steps.save-unchanged.outputs.mod-cache-saved }}"
          BUILD_SAVED: "${{ steps.save-unchanged.outputs.build-cache-saved }}"
        run: |
          fail=0
          if [ "$MOD_SAVED" != "false" ]; then
            echo "::error::expected mod-cache-saved=false for an unchanged cache on backend '$BACKEND', got '$MOD_SAVED'"
            fail=1
          fi
          if [ "$BUILD_SAVED" != "false" ]; then
            echo "::error::expected build-cache-saved=false for an unchanged cache on backend '$BACKEND', got '$BUILD_SAVED'"
            fail=1
          fi
          exit "$fail"

      - name: "DEBUG snapshot the build cache before the rebuild"
        shell: "bash"
        run: |
          gocache="$(go env GOCACHE)"
          echo "GOCACHE=$gocache"
          find "$gocache" -mindepth 2 -name '*-d' -type f | sed "s|$gocache/||" | LC_ALL=C sort > /tmp/dbg-before-d.txt
          find "$gocache" -mindepth 2 -name '*-a' -type f | sed "s|$gocache/||" | LC_ALL=C sort > /tmp/dbg-before-a.txt
          echo "outputs (-d): $(wc -l < /tmp/dbg-before-d.txt)"
          echo "records (-a): $(wc -l < /tmp/dbg-before-a.txt)"
          find "$gocache" -maxdepth 1 -printf "%TF %TT %s %f\\n" | LC_ALL=C sort | head -20

      # A CI checkout rewrites every mtime, and Go keys its per-directory source
      # indexes on file mtimes, so a rebuild after mtime-only churn mints new
      # index records that point at outputs the cache already holds. The
      # fingerprint covers the outputs, not the records, so this must still
      # read as "unchanged".
      - name: "Rebuild after an mtime-only change"
        working-directory: "_test/fixtures/go"
        run: |
          touch -d "2011-05-06 07:08:09" ./*
          go build -o /dev/null .

      - name: "DEBUG diff the build cache after the rebuild"
        shell: "bash"
        run: |
          gocache="$(go env GOCACHE)"
          find "$gocache" -mindepth 2 -name '*-d' -type f | sed "s|$gocache/||" | LC_ALL=C sort > /tmp/dbg-after-d.txt
          find "$gocache" -mindepth 2 -name '*-a' -type f | sed "s|$gocache/||" | LC_ALL=C sort > /tmp/dbg-after-a.txt
          echo "outputs (-d): $(wc -l < /tmp/dbg-before-d.txt) -> $(wc -l < /tmp/dbg-after-d.txt)"
          echo "records (-a): $(wc -l < /tmp/dbg-before-a.txt) -> $(wc -l < /tmp/dbg-after-a.txt)"
          echo "--- output (-d) diff (< gone, > new) ---"
          diff /tmp/dbg-before-d.txt /tmp/dbg-after-d.txt || true
          echo "--- new outputs, with size and mtime ---"
          comm -13 /tmp/dbg-before-d.txt /tmp/dbg-after-d.txt | while read -r f; do
            stat -c "%y %s %n" "$gocache/$f"
          done
          echo "--- record (-a) diff count only ---"
          diff /tmp/dbg-before-a.txt /tmp/dbg-after-a.txt | grep -c '^[<>]' || true
          echo "--- cache root ---"
          find "$gocache" -maxdepth 1 -printf "%TF %TT %s %f\\n" | LC_ALL=C sort | head -20

      - name: "Save go caches after the mtime-only change"
        id: "save-touched"
        uses: "./cache-go/save"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.sum"

      - name: "Assert an mtime-only change stores nothing"
        continue-on-error: true # DEBUG: let the later steps run too
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_SAVED: "${{ steps.save-touched.outputs.mod-cache-saved }}"
          BUILD_SAVED: "${{ steps.save-touched.outputs.build-cache-saved }}"
        run: |
          fail=0
          if [ "$BUILD_SAVED" != "false" ]; then
            echo "::error::expected build-cache-saved=false after an mtime-only change on backend '$BACKEND', got '$BUILD_SAVED'"
            fail=1
          fi
          if [ "$MOD_SAVED" != "false" ]; then
            echo "::error::expected mod-cache-saved=false after an mtime-only change on backend '$BACKEND', got '$MOD_SAVED'"
            fail=1
          fi
          exit "$fail"

      - name: "Rebuild the fixture after a source change"
        working-directory: "_test/fixtures/go"
        env:
          MARKER: "${{ github.run_id }}-${{ github.run_attempt }}"
        run: |
          printf '\nvar cacheGoTestMarker = "%s"\n' "$MARKER" >> main.go
          go build -o /dev/null .

      - name: "Save go caches after the rebuild"
        id: "save-changed"
        uses: "./cache-go/save"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.sum"

      # The two caches are keyed independently: a source change invalidates the
      # build cache but leaves go.sum, and therefore the module cache, alone.
      - name: "Assert only the build cache is saved after a rebuild"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_SAVED: "${{ steps.save-changed.outputs.mod-cache-saved }}"
          BUILD_SAVED: "${{ steps.save-changed.outputs.build-cache-saved }}"
        run: |
          fail=0
          if [ "$BUILD_SAVED" != "true" ]; then
            echo "::error::expected build-cache-saved=true after a rebuild on backend '$BACKEND', got '$BUILD_SAVED'"
            fail=1
          fi
          if [ "$MOD_SAVED" != "false" ]; then
            echo "::error::expected mod-cache-saved=false after a rebuild on backend '$BACKEND', got '$MOD_SAVED'"
            fail=1
          fi
          exit "$fail"
      - name: "Restore the rebuilt caches"
        id: "restore-rebuilt"
        uses: "./cache-go/restore"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.sum"

      - name: "Assert the rebuilt build cache is picked up"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          BUILD_MATCH: "${{ steps.restore-rebuilt.outputs.build-cache-match }}"
        run: |
          if [ "$BUILD_MATCH" != "partial" ]; then
            echo "::error::expected build-cache-match=partial after a rebuild on backend '$BACKEND', got '$BUILD_MATCH'"
            exit 1
          fi

      - name: "Restore a never-saved key"
        id: "restore-miss"
        uses: "./cache-go/restore"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-miss-${{ github.run_id }}-${{ github.run_attempt }}"
          dependency-path: "_test/fixtures/go/go.sum"

      - name: "Assert cache miss reports 'false', not empty"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_HIT: "${{ steps.restore-miss.outputs.mod-cache-hit }}"
          MOD_MATCH: "${{ steps.restore-miss.outputs.mod-cache-match }}"
          BUILD_MATCH: "${{ steps.restore-miss.outputs.build-cache-match }}"
        run: |
          fail=0
          if [ "$MOD_HIT" != "false" ]; then
            echo "::error::expected mod-cache-hit=false on a miss for backend '$BACKEND', got '$MOD_HIT'"
            fail=1
          fi
          if [ "$MOD_MATCH" != "none" ]; then
            echo "::error::expected mod-cache-match=none on a miss for backend '$BACKEND', got '$MOD_MATCH'"
            fail=1
          fi
          if [ "$BUILD_MATCH" != "none" ]; then
            echo "::error::expected build-cache-match=none on a miss for backend '$BACKEND', got '$BUILD_MATCH'"
            fail=1
          fi
          exit "$fail"

      # A different dependency file yields a different hash, so only the module
      # cache's restore-key can match.
      - name: "Restore with a different dependency hash"
        id: "restore-partial"
        uses: "./cache-go/restore"
        with:
          cache-backend: "${{ matrix.backend }}"
          s3-credentials: "${{ matrix.backend == 's3' && env.S3_CREDENTIALS || '' }}"
          name: "ci-cache-go-test"
          dependency-path: "_test/fixtures/go/go.mod"

      - name: "Assert restore-key (partial) match"
        shell: "bash"
        env:
          BACKEND: "${{ matrix.backend }}"
          MOD_HIT: "${{ steps.restore-partial.outputs.mod-cache-hit }}"
          MOD_MATCH: "${{ steps.restore-partial.outputs.mod-cache-match }}"
        run: |
          fail=0
          if [ "$MOD_HIT" != "false" ]; then
            echo "::error::expected mod-cache-hit=false on a partial match for backend '$BACKEND', got '$MOD_HIT'"
            fail=1
          fi
          if [ "$MOD_MATCH" != "partial" ]; then
            echo "::error::expected mod-cache-match=partial for backend '$BACKEND', got '$MOD_MATCH'"
            fail=1
          fi
          exit "$fail"
