---
name: "lint"

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  actionlint:
    name: "actionlint"
    runs-on: "blacksmith-2vcpu-ubuntu-2404-arm"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      # Use mise-action directly (not our setup-mise) so linting still runs even
      # when the repository's own composite actions are broken.
      - uses: "jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca" # v5.1.1
        with:
          install: true
          cache: false
          experimental: true

      - name: "Run actionlint"
        run: |
          actionlint -color

      - name: "Run shellcheck"
        run: |
          shellcheck cache-go/internal/*.sh
