---
name: "lint"

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  actionlint:
    name: "actionlint"
    runs-on: "blacksmith-2vcpu-ubuntu-2404-arm"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

      # Use mise-action directly (not our setup-mise) so linting still runs even
      # when the repository's own composite actions are broken.
      - uses: "jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518" # v4.2.5
        with:
          install: true
          cache: false
          experimental: true

      - name: "Run actionlint"
        run: |
          actionlint -color

      - name: "Run shellcheck"
        run: |
          shellcheck cache-go/internal/*.sh
