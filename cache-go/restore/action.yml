---
name: "cache-go - restore"
description: "Restores the Go module and build caches from the configured backend (s3 or github)."

inputs:
  cache-backend:
    description: |
      Which cache backend to use: "s3" or "github".

      Required. When set to "s3", s3-credentials is required.
    required: true
  s3-credentials:
    description: |
      The S3 credentials as a JSON object. Required when cache-backend is "s3".
      Must contain the following keys:

      - endpoint (no URL scheme)
      - access_key
      - secret_key
      - bucket_name
    default: ""
  name:
    default: "default"
  dependency-path:
    description: "Path to the dependency file to hash for the cache key (defaults to go.sum at the workspace root)"

outputs:
  mod-cache-hit:
    description: |
      "true" only when the module cache's primary key was an exact match;
      "false" for a restore-key match or a total miss. See mod-cache-match to
      tell those apart.
    # cache-hit is 'true' only on an exact primary-key match; every other case
    # (a restore-key match or a total miss) is non-'true', so '== true' coerces
    # it to a strict 'true'/'false' string (action outputs are always strings).
    # The parentheses are required: '==' binds tighter than '||', so without
    # them the comparison would only apply to the github output.
    value: ${{ (steps.restore-mod-s3.outputs.cache-hit || steps.restore-mod-github.outputs.cache-hit) == 'true' }}
  mod-cache-match:
    description: |
      How the module cache was matched: "exact" (primary key hit), "partial"
      (only a restore-key matched), or "none" (no match at all).
    # 'exact' when cache-hit is 'true'. Otherwise 'partial' if a cache was
    # restored at all and 'none' if not: cache-matched-key holds the restored
    # cache's key and is empty only on a total miss (documented for both
    # backends), so it splits 'partial' from 'none' without relying on whether
    # cache-hit is '' or 'false' on a miss. Exactly one backend step runs, so
    # each '||' selects the active backend's value.
    value: >-
      ${{ (steps.restore-mod-s3.outputs.cache-hit || steps.restore-mod-github.outputs.cache-hit) == 'true' && 'exact'
      || (steps.restore-mod-s3.outputs.cache-matched-key || steps.restore-mod-github.outputs.cache-matched-key) != '' && 'partial'
      || 'none' }}
  build-cache-match:
    description: |
      How the build cache was matched: "partial" (a restore-key matched) or
      "none" (no match at all).

      There is deliberately no "exact" and no build-cache-hit: the build cache
      is keyed on a fingerprint of its own contents, which cannot be known
      before it is restored, so it is always matched through its restore-key.
    # Only cache-matched-key can tell a restore-key match from a total miss
    # here, since cache-hit is never 'true' for a prefix-only lookup.
    value: >-
      ${{ (steps.restore-build-s3.outputs.cache-matched-key || steps.restore-build-github.outputs.cache-matched-key) != '' && 'partial'
      || 'none' }}

runs:
  using: "composite"
  steps:
    - name: "Validate the cache backend configuration"
      shell: "bash"
      env:
        CACHE_BACKEND: "${{ inputs.cache-backend }}"
        S3_CREDENTIALS: "${{ inputs.s3-credentials }}"
      run: |
        case "$CACHE_BACKEND" in
          s3)
            if [ -z "$S3_CREDENTIALS" ]; then
              echo "::error::cache-backend is 's3' but s3-credentials was not provided"
              exit 1
            fi
            ;;
          github) ;;
          *)
            echo "::error::invalid cache-backend '$CACHE_BACKEND' (expected: s3 or github)"
            exit 1
            ;;
        esac

    - name: "Resolve go cache configuration"
      id: "go-cache"
      shell: "bash"
      env:
        CACHE_NAME: "${{ inputs.name }}"
        DEP_HASH: "${{ hashFiles(inputs.dependency-path == '' && 'go.sum' || inputs.dependency-path) }}"
      run: |
        bash "${{ github.action_path }}/../internal/go-cache-config.sh"

    - name: "Clean cache directories"
      shell: "bash"
      run: |
        go clean -cache -modcache

    - id: "restore-mod-s3"
      name: "Restore go module cache (S3)"
      if: "inputs.cache-backend == 's3'"
      uses: "tespkg/actions-cache/restore@e07e2d4953dc8c020d447363e5064e36d04f3cf9" # v1.10.2
      with:
        endpoint: ${{ fromJson(inputs.s3-credentials).endpoint }}
        accessKey: ${{ fromJson(inputs.s3-credentials).access_key }}
        secretKey: ${{ fromJson(inputs.s3-credentials).secret_key }}
        bucket: ${{ fromJson(inputs.s3-credentials).bucket_name }}
        use-fallback: false
        key: "${{ steps.go-cache.outputs.mod-key }}"
        restore-keys: |
          ${{ steps.go-cache.outputs.mod-restore-key }}
        path: |
          ${{ steps.go-cache.outputs.mod_cache }}

    - id: "restore-mod-github"
      name: "Restore go module cache (GitHub)"
      if: "inputs.cache-backend == 'github'"
      uses: "actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8" # v6.0.0
      with:
        key: "${{ steps.go-cache.outputs.mod-key }}"
        restore-keys: |
          ${{ steps.go-cache.outputs.mod-restore-key }}
        path: |
          ${{ steps.go-cache.outputs.mod_cache }}

    # The build cache is keyed on a fingerprint of its own contents, which is
    # unknowable until it has been restored, so there is no primary key to look
    # up. Passing build-restore-key as the key too is deliberate: saved keys are
    # always prefix+fingerprint, so the prefix alone can never match one, and
    # the lookup falls through to the restore-key - which returns the most
    # recently saved build cache for this scope.
    - id: "restore-build-s3"
      name: "Restore go build cache (S3)"
      if: "inputs.cache-backend == 's3'"
      uses: "tespkg/actions-cache/restore@e07e2d4953dc8c020d447363e5064e36d04f3cf9" # v1.10.2
      with:
        endpoint: ${{ fromJson(inputs.s3-credentials).endpoint }}
        accessKey: ${{ fromJson(inputs.s3-credentials).access_key }}
        secretKey: ${{ fromJson(inputs.s3-credentials).secret_key }}
        bucket: ${{ fromJson(inputs.s3-credentials).bucket_name }}
        use-fallback: false
        key: "${{ steps.go-cache.outputs.build-restore-key }}"
        restore-keys: |
          ${{ steps.go-cache.outputs.build-restore-key }}
        path: |
          ${{ steps.go-cache.outputs.build_cache }}

    - id: "restore-build-github"
      name: "Restore go build cache (GitHub)"
      if: "inputs.cache-backend == 'github'"
      uses: "actions/cache/restore@2c8a9bd7457de244a408f35966fab2fb45fda9c8" # v6.0.0
      with:
        key: "${{ steps.go-cache.outputs.build-restore-key }}"
        restore-keys: |
          ${{ steps.go-cache.outputs.build-restore-key }}
        path: |
          ${{ steps.go-cache.outputs.build_cache }}

    # Hand cache-go/save what it needs to skip uploads that would store nothing.
    # GITHUB_ENV is job-wide, so this assumes cache-go is used once per job -
    # which it must be anyway, since a runner has a single build cache
    # directory.
    - name: "Record what cache-go/save can skip"
      shell: "bash"
      env:
        # The module cache is keyed on the dependency hash, so an exact match
        # means the backend already holds this exact key and saving it again
        # would store nothing. Left empty in every other case, which is never a
        # valid key, so save always uploads then.
        MOD_KEY_ALREADY_SAVED: >-
          ${{ (steps.restore-mod-s3.outputs.cache-hit || steps.restore-mod-github.outputs.cache-hit) == 'true'
          && steps.go-cache.outputs.mod-key || '' }}
      run: |
        build_hash="$(bash "${{ github.action_path }}/../internal/go-build-cache-hash.sh")"
        {
          echo "CACHE_GO_BUILD_HASH=${build_hash}"
          echo "CACHE_GO_MOD_KEY=${MOD_KEY_ALREADY_SAVED}"
        } | tee -a "$GITHUB_ENV"
