---
name: "cache-directory - save"
description: "Saves a directory to the GitHub Actions cache."

inputs:
  path:
    description: "Directory to save (a leading ~ is expanded)"
    required: true
  name:
    description: "Name that scopes the cache keys (defaults to the id of the calling job)"

outputs:
  cache-saved:
    description: |
      "true" when the directory was handed to the cache, "false" when the
      upload was skipped - either because the directory had not changed since
      cache-directory/restore ran, or because it does not exist.
    value: "${{ steps.plan.outputs.save }}"

runs:
  using: "composite"
  steps:
    # Runs before the configuration is resolved because the cache key is built
    # from this fingerprint.
    - name: "Fingerprint the directory"
      id: "dir-hash"
      shell: "bash"
      env:
        CACHE_DIRECTORY: "${{ inputs.path }}"
      run: |
        hash="$(bash "${{ github.action_path }}/../internal/directory-hash.sh")"
        echo "hash=${hash}" | tee -a "$GITHUB_OUTPUT"

    - name: "Resolve cache configuration"
      id: "config"
      shell: "bash"
      env:
        CACHE_NAME: "${{ inputs.name == '' && github.job || inputs.name }}"
        CACHE_DIRECTORY: "${{ inputs.path }}"
        DIR_HASH: "${{ steps.dir-hash.outputs.hash }}"
      run: |
        bash "${{ github.action_path }}/../internal/cache-config.sh"

    # actions/cache does not report whether it stored anything, and does not
    # refuse an upload cheaply, so skipping a redundant save has to be decided
    # here. The comparison is against the value cache-directory/restore
    # recorded, and falls through to saving when it did not run in this job.
    - name: "Decide whether the directory needs saving"
      id: "plan"
      shell: "bash"
      env:
        DIRECTORY: "${{ steps.config.outputs.directory }}"
        DIR_HASH: "${{ steps.dir-hash.outputs.hash }}"
        HASH_ENV_VAR: "${{ steps.config.outputs.hash-env-var }}"
      run: |
        # A missing directory fingerprints to the digest of the empty input,
        # which is a perfectly valid key. Saving it would shadow a populated
        # cache for this scope, since restore always takes the most recently
        # saved one, so it is refused outright rather than compared.
        if [ ! -d "$DIRECTORY" ]; then
          save="false"
          echo "directory '$DIRECTORY' does not exist; skipping its upload"
        elif [ "$DIR_HASH" = "${!HASH_ENV_VAR:-}" ]; then
          save="false"
          echo "directory '$DIRECTORY' unchanged since restore; skipping its upload"
        else
          save="true"
        fi

        echo "save=${save}" | tee -a "$GITHUB_OUTPUT"

    - name: "Cache directory"
      if: "steps.plan.outputs.save == 'true'"
      uses: "actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
      with:
        key: "${{ steps.config.outputs.key }}"
        path: |
          ${{ steps.config.outputs.directory }}
